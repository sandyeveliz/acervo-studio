[project]
name = "acervo-studio"
version = "0.6.0-dev"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "ollama>=0.3.0",
    "chromadb>=0.5.0",
    "mcp>=1.0.0",
    "a2a-sdk>=0.2.0",
    "pydantic>=2.0",
    "anyio>=4.0",
    "rich>=13.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "networkx>=3.0",
    "tomli>=2.0",
    "tomli_w>=1.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0",
    "httpx>=0.27",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "acervo",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.setuptools.packages.find]
include = ["config*", "core*", "providers*", "api*", "db*", "plugins*", "utils*"]

[tool.setuptools]
py-modules = []

[project.optional-dependencies]
dev = []

[tool.uv.sources]
acervo = { path = "../acervo", editable = true }
