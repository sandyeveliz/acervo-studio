[lmstudio]
base_url = "http://localhost:11434/v1"
model = "gemma4:e4b"
context_window = 32000
kv_cache = true

[lmstudio_utility]
base_url = "http://localhost:11434/v1"
model = "acervo-extractor-v3-Q4_K_M"
context_window = 32000
kv_cache = false

[ollama]
base_url = "http://localhost:11434"
embed_model = "qwen3-embedding"

[context]
hot_layer_max_messages = 2
hot_layer_max_tokens = 500
warm_layer_max_tokens = 800
topic_change_embed_threshold = 0.65
compaction_trigger_tokens = 2000
plan_mode = false
history_window = 2

[graph]
persist_path = "data/graph"
topics_path = "data/topics"
sessions_path = "data/sessions"
merge_similarity_threshold = 0.85

[routing]
max_local_latency_ms = 3000
sensitive_data_local_only = true

[pricing]
lmstudio = 0.0
ollama = 0.0
openrouter = 1e-06
anthropic = 3e-06

[web_search]
max_results = 5
enabled = true

[plugins.acervo]
enabled = true

[tui]
refresh_rate = 10
log_max_lines = 500
