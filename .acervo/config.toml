# Acervo configuration

[acervo]
workspace = "."
data_dir = ".acervo/data"
owner = ""

[acervo.model]
# Single model for everything — fine-tuned Qwen3.5-9B handles chat + extraction.
# Behavior is determined by the system prompt, not the model.
name = "acervo-extractor-qwen3.5-9b"
url = "http://localhost:1234/v1"
# api_key = ""

[acervo.models]
# Per-role overrides. Empty name = use [acervo.model].
# With a single fine-tuned model, no overrides are needed.

[acervo.models.extractor]
name = ""

[acervo.models.summarizer]
name = ""

[acervo.embeddings]
# Embeddings model for topic detection L2 + vector store semantic search
url = "http://localhost:11434"
model = "qwen3-embedding"
# api_key = ""

[acervo.proxy]
port = 9470
# target is optional — clients can send X-Forward-To header instead
# target = ""
provider_name = "LM Studio"

[acervo.changelog]
# Tool names that indicate file modifications (for changelog tracking in proxy mode)
write_tools = ["write_file", "edit_file", "create_file", "str_replace_editor", "write_to_file", "insert_code_block", "replace_in_file", "str_replace"]
delete_tools = ["delete_file", "remove_file"]

[acervo.indexing]
extensions = [".py", ".ts", ".js", ".tsx", ".jsx", ".md"]
ignore = ["node_modules", ".git", "dist", "__pycache__", ".venv", "venv", "build", ".next", ".acervo"]

[acervo.context]
max_tokens = 32000
injection = "system"

[acervo.prompts]
# Prompts live as .txt files in this directory.
# Each file overrides the built-in default. Delete a file to use the default.
# Files: s1_5_graph_update.txt, extractor_search.txt, summarizer.txt
dir = ".acervo/prompts"
